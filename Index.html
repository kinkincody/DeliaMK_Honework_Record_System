<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>各級表單連結導航</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
            background-color: #f4f6f9;
            color: #333;
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-bottom: 25px;
            font-size: 1.8rem;
            color: #2c3e50;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 850px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 年級卡片區塊 */
        .grade-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            border-left: 8px solid transparent;
            gap: 20px;
        }

        .grade-title {
            font-size: 1.25rem;
            font-weight: bold;
            min-width: 60px;
            color: inherit;
        }

        .buttons-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            flex: 1;
        }

        /* 班級按鈕共用樣式 */
        .class-btn {
            flex: 1;
            min-width: 90px;
            text-align: center;
            padding: 12px 16px;
            border-radius: 8px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
            transition: all 0.2s ease-in-out;
            display: inline-block;
        }

        .class-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
            filter: brightness(1.08);
        }

        .class-btn:active {
            transform: translateY(0);
        }

        /* ====== 各年級專屬顏色 ====== */
        /* J1: 活力紅/珊瑚色 */
        .grade-1 { border-left-color: #e74c3c; }
        .grade-1 .grade-title { color: #e74c3c; }
        .grade-1 .class-btn { background-color: #e74c3c; }

        /* J2: 陽光橙 */
        .grade-2 { border-left-color: #e67e22; }
        .grade-2 .grade-title { color: #d35400; }
        .grade-2 .class-btn { background-color: #e67e22; }

        /* J3: 翡翠綠 */
        .grade-3 { border-left-color: #27ae60; }
        .grade-3 .grade-title { color: #27ae60; }
        .grade-3 .class-btn { background-color: #27ae60; }

        /* J4: 湖水藍 / 青色 */
        .grade-4 { border-left-color: #16a085; }
        .grade-4 .grade-title { color: #16a085; }
        .grade-4 .class-btn { background-color: #16a085; }

        /* J5: 經典深藍 */
        .grade-5 { border-left-color: #2980b9; }
        .grade-5 .grade-title { color: #2980b9; }
        .grade-5 .class-btn { background-color: #2980b9; }

        /* J6: 典雅紫 */
        .grade-6 { border-left-color: #8e44ad; }
        .grade-6 .grade-title { color: #8e44ad; }
        .grade-6 .class-btn { background-color: #8e44ad; }

        /* 手機版排版優化 */
        @media (max-width: 600px) {
            .grade-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .buttons-group {
                width: 100%;
            }
        }
    </style>
</head>
