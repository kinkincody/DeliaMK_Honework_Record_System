<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework Record Portal 2026-2027</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            min-height: 100vh;
            padding: 40px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-box {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.1rem;
            color: #1e293b;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 800;
        }

        p.subtitle {
            color: #64748b;
            font-size: 1.05rem;
        }

        .container {
            width: 100%;
            max-width: 820px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .grade-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 18px 24px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            border-left: 10px solid transparent;
            gap: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .grade-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .grade-label {
            font-size: 1.3rem;
            font-weight: 800;
            min-width: 70px;
            display: flex;
            align-items: center;
            letter-spacing: 0.5px;
        }

        .buttons-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            flex: 1;
        }

        .class-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 16px;
            border-radius: 10px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 700;
            font-size: 1.15rem;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.12);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 1px;
        }

        .class-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
            filter: brightness(1.1);
        }

        .class-btn:active {
            transform: translateY(0);
        }

        /* Grade Themes */
        /* J1: Bright Red */
        .grade-1 { border-left-color: #ef4444; }
        .grade-1 .grade-label { color: #dc2626; }
        .grade-1 .class-btn { background: linear-gradient(135deg, #ef4444, #dc2626); }

        /* J2: Bright Orange */
        .grade-2 { border-left-color: #f97316; }
        .grade-2 .grade-label { color: #ea580c; }
        .grade-2 .class-btn { background: linear-gradient(135deg, #f97316, #ea580c); }

        /* J3: Emerald Green */
        .grade-3 { border-left-color: #10b981; }
        .grade-3 .grade-label { color: #059669; }
        .grade-3 .class-btn { background: linear-gradient(135deg, #10b981, #059669); }

        /* J4: Cyan Blue */
        .grade-4 { border-left-color: #06b6d4; }
        .grade-4 .grade-label { color: #0891b2; }
        .grade-4 .class-btn { background: linear-gradient(135deg, #06b6d4, #0891b2); }

        /* J5: Royal Blue */
        .grade-5 { border-left-color: #3b82f6; }
        .grade-5 .grade-label { color: #2563eb; }
        .grade-5 .class-btn { background: linear-gradient(135deg, #3b82f6, #2563eb); }

        /* J6: Purple */
        .grade-6 { border-left-color: #8b5cf6; }
        .grade-6 .grade-label { color: #7c3aed; }
        .grade-6 .class-btn { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }

        @media (max-width: 600px) {
            .grade-card {
                flex-direction: column;
                align-items: stretch;
                padding: 16px;
                gap: 12px;
            }
            .grade-label {
                text-align: center;
                justify-content: center;
            }
            .buttons-group {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
            .class-btn {
                padding: 12px 8px;
                font-size: 1rem;
            }
        }
    </style>
</head>
